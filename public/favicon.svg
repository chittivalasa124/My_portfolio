<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="subtleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#subtleGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="3" />
  
  <!-- "CR" Monogram -->
  <text 
    x="64" 
    y="70" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Inter', sans-serif" 
    font-size="56" 
    font-weight="800" 
    letter-spacing="-1.5px"
  >CR</text>
