name: Deploy Angular portfolio to GitHub Pages

on:
  schedule:
    - cron: '*/30 * * * *' # Auto-sync live contributions & deploy every 30 minutes
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch live GitHub contributions
        run: node scripts/fetch-github.js

      - name: Commit updated contributions if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-contributions.json
          git diff --staged --quiet || (git commit -m "chore(contributions): sync live GitHub contributions [skip ci]" && git push)

      - name: Build Angular application
        run: npm run build -- --configuration production --base-href /My_portfolio/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
